# Builds the paper: eleven MCMC fits, every derived quantity and figure, and
# the three rendered documents. One pipeline, no reduced mode -- a run that
# skipped rendering could not catch the errors that only rendering exposes,
# and targets rebuilds only what changed, so a warm run after a text edit is
# minutes rather than hours.
#
# Cold (empty cache) this is a long job: eleven full fits on a two-core runner.
# It fits inside the six-hour ceiling, and every later run restores the store
# and refits only what the change touched.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the cached store and rebuild everything"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case the image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull if the image is published, build it if not. docker-publish.yaml is
      # triggered by the same push and takes about ten minutes, so on a push
      # that touches the Dockerfile there is nothing to pull yet; and on a push
      # that changes only R code it does not run at all, so waiting for it is
      # not an option either. Falling back to a local build removes the
      # ordering dependency between the two workflows entirely.
      - name: Get the compendium image
        run: |
          if ! docker pull ${{ steps.img.outputs.name }}:latest; then
            echo "::notice::No published image to pull; building it locally."
            docker build -t ${{ steps.img.outputs.name }}:latest .
          fi

      - name: Restore the targets store
        if: ${{ !inputs.fresh }}
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            targets-${{ runner.os }}-

      - name: tar_make
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            -e HOME=/work \
            ${{ steps.img.outputs.name }}:latest \
            R -q -e "targets::tar_make()"

      - name: Fix ownership of files the container wrote
        if: always()
        run: sudo chown -R "$USER" . || true

      - name: Convergence summary
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            -e HOME=/work ${{ steps.img.outputs.name }}:latest \
            R -q -e "print(targets::tar_read(barg_diag_tbl))" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documents
          path: |
            paper/manuscript.docx
            paper/supplementary.docx
            paper/barg/barg_report.html
            paper/barg/figures/
          if-no-files-found: warn
