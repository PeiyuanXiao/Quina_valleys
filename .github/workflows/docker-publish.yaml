# Builds the compendium image and pushes it to the GitHub Container Registry.
#
# The image is the slow part of every other job here: CmdStan is compiled from
# source and renv restores about 200 packages. Building it once and pulling it
# afterwards is what keeps the pipeline jobs to minutes, and it is also how a
# reader gets the environment without building anything:
#
#   docker pull ghcr.io/peiyuanxiao/quina_valleys:latest
name: docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - renv.lock
      - .github/workflows/docker-publish.yaml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case the image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
