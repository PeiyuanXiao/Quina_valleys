# Two projects over one _targets.R.  The reduced project has its own store, so
# a smoke test can never overwrite the fits the paper reports from, and it
# stops short of rendering, so it cannot overwrite the documents either -- the
# three .qmd files write to the same paths whichever project built them.
# This replaces the old BARG_QUICK environment variable and fits_quick/.
#
#   tar_make()                                            the full pipeline
#   TAR_PROJECT=quick Rscript -e "targets::tar_make()"    the smoke test
#   targets::tar_config_set(project = "quick")            to switch interactively
main:
  script: _targets.R
  store: _targets
quick:
  script: _targets.R
  store: _targets_quick
